server {
    listen 80;
    server_name localhost;
    client_max_body_size 500M;

    # Docker встроенный DNS: без этого nginx запоминает IP upstream при старте и после
    # пересборки frontend/backend даёт 502 (старый IP контейнера).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /api/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        # Потоковая отдача весов / архивов через backend без буферизации всего файла в nginx
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /minio/ {
        set $upstream_minio http://minio:9001;
        proxy_pass $upstream_minio/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        set $upstream_frontend http://frontend:80;
        proxy_pass $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
