[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleautoml"
version = "0.1.0"
description = "Простая AutoML-система для задач компьютерного зрения (классификация и сегментация)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "backend*"]
