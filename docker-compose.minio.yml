# Отдельный микросервис объектного хранилища (S3-совместимый API).
# Подключается в основной стек через `include` в docker-compose.yml
# или вручную: docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    # Образ minio/minio без shell/wget — внешний healthcheck не используем
    restart: unless-stopped

volumes:
  minio_data:
